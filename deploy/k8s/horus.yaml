# Minimal Horus manifest: Deployment (1 replica) + in-cluster ClusterIP Service.
# It does NOT create MySQL, Ingress/TLS or backups - your platform provides those.
#
# Before applying:
#   1. Initialize the external MySQL once: DATABASE_URL=... ./scripts/init-sql.sh
#      (8 tables + initial owner, no DDL rights needed afterwards)
#   2. Put the runtime .env into a Secret named horus-env, key ".env":
#      kubectl -n horus create secret generic horus-env --from-file=.env=/secure/horus/.env
#      Include HORUS_DB_PUSH=false (and HORUS_DB_INIT=false) so startup skips drizzle-kit.
#   3. Replace the image below with the tag you pushed.
# Docs: docs/kubernetes-deployment.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horus
spec:
  replicas: 1
  # The digest scheduler assumes a single process; do not scale out or add an HPA.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: horus
  template:
    metadata:
      labels:
        app: horus
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: horus
          image: horus:local # Replace with your registry image/tag.
          ports:
            - name: http
              containerPort: 3000
          env:
            # Runtime config comes from the mounted .env; container-level env vars
            # listed here win over the file. HORUS_DB_PUSH/HORUS_DB_INIT belong in the file.
            - name: HORUS_ENV_FILE
              value: /etc/horus/.env
          volumeMounts:
            - name: config
              mountPath: /etc/horus
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Process readiness only, deliberately independent of MySQL availability.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          secret:
            secretName: horus-env
            defaultMode: 0440
            items:
              - key: .env
                path: .env
---
apiVersion: v1
kind: Service
metadata:
  name: horus
spec:
  selector:
    app: horus
  ports:
    - name: http
      port: 3000
      targetPort: http
